name: "💡 Feature request"
description: "Got an idea for something the place could use? We'd love to hear it."
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Ideas are how this place grows. Tell us what you're picturing.

  - type: dropdown
    id: product
    attributes:
      label: Where would this apply?
      options:
        - Website (idyll.cc)
        - Android App
        - Both
        - Not sure
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What's missing, or what's the problem?
      description: What's prompting this idea — something that felt hard, slow, or just not there yet?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What would you like to see?
      description: Describe the feature or change as you imagine it.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: Any other ways you've thought of solving this, or workarounds you're using now.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Anything else?
      description: Sketches, references, or other context — drag and drop files if it helps explain.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before you send this
      options:
        - label: I looked through existing issues and didn't see this idea already suggested.
          required: true
